<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mother City Look Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a4a; font-family: Inter, Arial, sans-serif; color: #fff; }
    #ld { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    .bar { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .bar button { font: 800 13px Inter, sans-serif; color: #fff; background: rgba(10, 16, 24, 0.5); border: 1.5px solid rgba(255, 255, 255, 0.35); border-radius: 999px; padding: 8px 14px; min-height: 36px; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
    .bar button.on { background: #ffcf33; color: #111; border-color: #ffcf33; }
    .tag { position: absolute; left: calc(12px + env(safe-area-inset-left)); bottom: calc(10px + env(safe-area-inset-bottom)); font: 400 22px 'Bebas Neue', Impact, sans-serif; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); pointer-events: none; }
    .tag small { display: block; font: 600 11px Inter, sans-serif; letter-spacing: 0; opacity: 0.85; }
    #ld-fps { position: absolute; right: calc(12px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 11px; opacity: 0.7; pointer-events: none; }
    #ld-stick { position: absolute; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.45); background: rgba(10, 16, 24, 0.25); opacity: 0; pointer-events: none; }
    #ld-stick.on { opacity: 1; }
    #ld-knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <div id="ld">
    <div class="bar">
      <button data-preset="golden">Golden hour</button>
      <button data-preset="midday">Midday</button>
      <button data-preset="night">Night</button>
      <button id="ld-tour">Orbit</button>
    </div>
    <div class="tag">Look test · Sunny toon<small>Drag to look · pinch to zoom · left thumb or WASD walks Sizwe</small></div>
    <div id="ld-fps"></div>
    <div id="ld-stick"><div id="ld-knob"></div></div>
  </div>
  <script type="module" src="src/lookdev/main.js"></script>
</body>
</html>
